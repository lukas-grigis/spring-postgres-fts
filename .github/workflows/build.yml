name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Testcontainers → real Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # No service container: the suite starts its own postgres:18-trixie through
      # Testcontainers and copies book_synonym.syn into it before Liquibase creates
      # the dictionary. Docker is present on ubuntu-latest by default.
      - name: Test
        run: mvn -B -ntp verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 26
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
